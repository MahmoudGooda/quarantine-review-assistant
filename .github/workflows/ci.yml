name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  powershell:
    name: PSScriptAnalyzer and Pester
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Install modules
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
      - name: PSScriptAnalyzer (errors fail the build, warnings are reported)
        shell: pwsh
        run: |
          $results = foreach ($dir in 'src', 'tools', 'tests') {
            Invoke-ScriptAnalyzer -Path $dir -Recurse -Severity Error, Warning
          }
          foreach ($r in $results) {
            $level = if ($r.Severity -eq 'Error') { 'error' } else { 'warning' }
            $file = (Resolve-Path -LiteralPath $r.ScriptPath -Relative) -replace '^\.\\', '' -replace '\\', '/'
            Write-Host "::$level file=$file,line=$($r.Line)::$($r.RuleName): $($r.Message)"
          }
          $errors = @($results | Where-Object Severity -eq 'Error')
          Write-Host "$($errors.Count) error(s), $(@($results | Where-Object Severity -eq 'Warning').Count) warning(s)"
          if ($errors.Count) { exit 1 }
      - name: Pester
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests/powershell'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # The CLI scans the whole history on every run. (gitleaks-action scans only the pushed range,
      # which fails when that range starts at the root commit.)
      - name: Install gitleaks 8.30.1 (checksum-pinned)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan the full git history
        run: ./gitleaks git . --redact --verbose --no-banner
